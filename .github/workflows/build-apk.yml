name: APK 빌드

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: APK 만들기
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk OneClickAlert.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OneClickAlert-apk
          path: OneClickAlert.apk

      - name: 릴리스에 올리기
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          gh release create "v$VER-${{ github.run_number }}" OneClickAlert.apk \
            --title "원클릭 알림 $VER (빌드 ${{ github.run_number }})" \
            --notes "폰에서 OneClickAlert.apk를 눌러 설치하세요." \
            --latest
