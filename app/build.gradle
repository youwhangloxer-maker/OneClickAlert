plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oneclick.alert'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oneclick.alert'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // 빌드마다 같은 키로 서명해야 기존 앱 위에 업데이트로 설치됨
    signingConfigs {
        fixed {
            storeFile file('release.keystore')
            storePassword 'oneclickalert'
            keyAlias 'oneclick'
            keyPassword 'oneclickalert'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
