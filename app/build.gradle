plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oneclick.alert'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oneclick.alert'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 별도 서명 키 없이 바로 설치할 수 있도록 디버그 키로 서명
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
